name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          xcodebuild \
            -project MacSpa.xcodeproj \
            -scheme MacSpa \
            -configuration Debug \
            -destination 'platform=macOS' \
            clean test
